<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07070b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<title>{% block title %}Panel{% endblock %} · AUTH</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-192.png') }}">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark">◆</div>
      <div class="brand-txt">
        <div class="brand-name">AUTH</div>
        <div class="brand-sub">{{ GAME_NAME|upper }}</div>
      </div>
    </div>
    <div class="topbar-right">
      <span class="admin-chip">{{ session.get('admin','1') }}</span>
      <a class="icon-btn" href="{{ url_for('logout') }}" title="Logout">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </a>
    </div>
  </div>
</header>

<main class="main">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="flashes">
      {% for cat, msg in messages %}
        <div class="flash flash-{{ cat }}">{{ msg }}</div>
      {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  {% block content %}{% endblock %}
</main>

<nav class="tabbar">
  <a href="{{ url_for('dashboard') }}" class="tab {% if request.endpoint=='dashboard' %}active{% endif %}">
    <span class="tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg></span>
    <span class="tab-lbl">Home</span>
  </a>
  <a href="{{ url_for('keys_list') }}" class="tab {% if request.endpoint in ['keys_list','key_new','key_edit'] %}active{% endif %}">
    <span class="tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.5 12.5 19 4l3 3-2 2-2-2-2.5 2.5L18 12l-3 3-2.5-2.5"/></svg></span>
    <span class="tab-lbl">Keys</span>
  </a>
  <a href="{{ url_for('key_new') }}" class="tab tab-add">
    <span class="tab-ico">+</span><span class="tab-lbl">New</span>
  </a>
  <a href="{{ url_for('logs_view') }}" class="tab {% if request.endpoint=='logs_view' %}active{% endif %}">
    <span class="tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="14" y2="18"/></svg></span>
    <span class="tab-lbl">Logs</span>
  </a>
</nav>
</body>
</html>
