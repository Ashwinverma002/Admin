<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0e">
<title>{% block title %}Panel{% endblock %} · AUTH</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark">◆</div>
      <div class="brand-txt">
        <div class="brand-name">AUTH</div>
        <div class="brand-sub">{{ GAME_NAME|upper }}</div>
      </div>
    </div>
    <div class="topbar-right">
      <span class="admin-chip">{{ session.get('admin','1') }}</span>
      <a class="icon-btn" href="{{ url_for('logout') }}" title="Logout">⏻</a>
    </div>
  </div>
</header>

<main class="main">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="flashes">
      {% for cat, msg in messages %}
        <div class="flash flash-{{ cat }}">{{ msg }}</div>
      {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  {% block content %}{% endblock %}
</main>

<nav class="tabbar">
  <a href="{{ url_for('dashboard') }}" class="tab {% if request.endpoint=='dashboard' %}active{% endif %}">
    <span class="tab-ico">▦</span><span class="tab-lbl">Home</span>
  </a>
  <a href="{{ url_for('keys_list') }}" class="tab {% if request.endpoint in ['keys_list','key_new','key_edit'] %}active{% endif %}">
    <span class="tab-ico">🔑</span><span class="tab-lbl">Keys</span>
  </a>
  <a href="{{ url_for('key_new') }}" class="tab tab-add">
    <span class="tab-ico">＋</span><span class="tab-lbl">New</span>
  </a>
  <a href="{{ url_for('logs_view') }}" class="tab {% if request.endpoint=='logs_view' %}active{% endif %}">
    <span class="tab-ico">≡</span><span class="tab-lbl">Logs</span>
  </a>
</nav>
</body>
</html>
