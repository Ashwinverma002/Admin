<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07070b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<title>Login · ASHWIN</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: #07070b;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow: hidden;
  }

  /* Animated aurora background */
  .aurora {
    position: fixed; inset: -20%;
    z-index: 0;
    background:
      radial-gradient(600px circle at 20% 30%, rgba(139,92,246,.28), transparent 55%),
      radial-gradient(600px circle at 80% 70%, rgba(34,211,238,.22), transparent 55%),
      radial-gradient(700px circle at 50% 100%, rgba(236,72,153,.14), transparent 55%);
    filter: blur(20px);
    animation: drift 18s ease-in-out infinite alternate;
  }
  @keyframes drift {
    0%   { transform: translate3d(0,0,0) scale(1); }
    100% { transform: translate3d(-3%, 3%, 0) scale(1.08); }
  }

  /* Subtle grid overlay */
  .grid-overlay {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: radial-gradient(circle at center, black 30%, transparent 75%);
    -webkit-mask-image: radial-gradient(circle at center, black 30%, transparent 75%);
  }

  /* Card */
  .login-card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 400px;
    padding: 36px 30px 32px;
    border-radius: 26px;
    background: rgba(17, 20, 32, 0.62);
    backdrop-filter: blur(24px) saturate(160%);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.09);
    box-shadow:
      0 30px 80px rgba(0,0,0,.6),
      0 0 0 1px rgba(255,255,255,.02) inset,
      0 1px 0 rgba(255,255,255,.08) inset;
    animation: rise .6s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(24px) scale(.97); }
    to   { opacity: 1; transform: none; }
  }

  /* Gradient border glow on top */
  .login-card::before {
    content: '';
    position: absolute; inset: -1px;
    border-radius: 26px;
    padding: 1px;
    background: linear-gradient(135deg, rgba(139,92,246,.55), rgba(34,211,238,.35), transparent 60%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
    pointer-events: none;
  }

  /* Logo */
  .logo-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 20px;
  }
  .logo {
    width: 64px; height: 64px;
    border-radius: 20px;
    background: linear-gradient(135deg, #8b5cf6, #06b6d4);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    color: #fff;
    box-shadow:
      0 12px 32px rgba(139,92,246,.45),
      0 0 0 1px rgba(255,255,255,.15) inset;
    animation: pulseGlow 3s ease-in-out infinite;
  }
  @keyframes pulseGlow {
    0%, 100% { box-shadow: 0 12px 32px rgba(139,92,246,.45), 0 0 0 1px rgba(255,255,255,.15) inset; }
    50%      { box-shadow: 0 12px 44px rgba(139,92,246,.75), 0 0 0 1px rgba(255,255,255,.25) inset; }
  }

  h1 {
    text-align: center;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.3px;
    margin-bottom: 4px;
    background: linear-gradient(135deg, #fff, #c7d2fe);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .login-sub {
    text-align: center;
    font-size: 12.5px;
    color: rgba(255,255,255,.42);
    margin-bottom: 26px;
    letter-spacing: .3px;
  }

  /* Inputs */
  .field {
    margin-bottom: 16px;
    position: relative;
  }
  .field label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    color: rgba(255,255,255,.55);
    text-transform: uppercase;
    letter-spacing: .8px;
    margin-bottom: 7px;
  }
  .input-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }
  .input-wrap .ico {
    position: absolute;
    left: 14px;
    color: rgba(255,255,255,.35);
    font-size: 14px;
    pointer-events: none;
    transition: color .2s;
  }
  .field input {
    width: 100%;
    padding: 13px 14px 13px 42px;
    background: rgba(255,255,255,.035);
    border: 1px solid rgba(255,255,255,.09);
    border-radius: 13px;
    color: #fff;
    font-size: 14.5px;
    font-weight: 500;
    outline: none;
    transition: all .2s ease;
  }
  .field input::placeholder { color: rgba(255,255,255,.22); }
  .field input:hover { border-color: rgba(255,255,255,.15); }
  .field input:focus {
    border-color: rgba(139,92,246,.7);
    background: rgba(139,92,246,.06);
    box-shadow: 0 0 0 4px rgba(139,92,246,.14);
  }
  .field input:focus ~ .ico { color: #a78bfa; }

  /* Password toggle */
  .pw-toggle {
    position: absolute;
    right: 12px;
    background: none;
    border: none;
    color: rgba(255,255,255,.4);
    padding: 6px;
    cursor: pointer;
    border-radius: 8px;
    transition: all .15s;
    font-size: 14px;
  }
  .pw-toggle:hover { color: #fff; background: rgba(255,255,255,.06); }

  /* Submit */
  .submit-btn {
    width: 100%;
    margin-top: 8px;
    padding: 14px;
    border: none;
    border-radius: 13px;
    background: linear-gradient(135deg, #8b5cf6, #6366f1);
    color: #fff;
    font-weight: 700;
    font-size: 14.5px;
    letter-spacing: .3px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: all .25s ease;
    box-shadow: 0 12px 28px rgba(139,92,246,.4);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .submit-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,.25), transparent 40%);
    opacity: 0;
    transition: opacity .25s;
  }
  .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 16px 36px rgba(139,92,246,.55); }
  .submit-btn:hover::before { opacity: 1; }
  .submit-btn:active { transform: translateY(0); }
  .submit-btn:disabled { opacity: .7; cursor: wait; }

  /* Flash */
  .flash {
    padding: 11px 14px;
    border-radius: 12px;
    font-size: 13px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    animation: shake .4s ease;
  }
  .flash-error   { background: rgba(239,68,68,.12); border: 1px solid rgba(239,68,68,.3); color: #fca5a5; }
  .flash-success { background: rgba(34,197,94,.12); border: 1px solid rgba(34,197,94,.3); color: #86efac; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }

  /* Footer tag */
  .secure-tag {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
    margin-top: 18px;
    font-size: 11px;
    color: rgba(255,255,255,.28);
    letter-spacing: .4px;
  }
  .secure-tag i { color: rgba(34,211,238,.55); }
</style>
</head>
<body>

<div class="aurora"></div>
<div class="grid-overlay"></div>

<form class="login-card" method="post" autocomplete="off" id="loginForm">
  <div class="logo-wrap">
    <div class="logo"><i class="fa-solid fa-shield-halved"></i></div>
  </div>

  <h1>Welcome Back</h1>
  <p class="login-sub">Sign in to your admin panel</p>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for cat, msg in messages %}
        <div class="flash flash-{{ cat }}">
          <i class="fa-solid {% if cat == 'success' %}fa-circle-check{% else %}fa-circle-exclamation{% endif %}"></i>
          <span>{{ msg }}</span>
        </div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <div class="field">
    <label for="username">Username</label>
    <div class="input-wrap">
      <input type="text" id="username" name="username" placeholder="Enter username" autocomplete="off" autofocus required>
      <i class="fa-solid fa-user ico"></i>
    </div>
  </div>

  <div class="field">
    <label for="password">Password</label>
    <div class="input-wrap">
      <input type="password" id="password" name="password" placeholder="Enter password" autocomplete="off" required>
      <i class="fa-solid fa-lock ico"></i>
      <button type="button" class="pw-toggle" id="pwToggle" tabindex="-1" aria-label="Show password">
        <i class="fa-solid fa-eye"></i>
      </button>
    </div>
  </div>

  <button type="submit" class="submit-btn" id="submitBtn">
    <i class="fa-solid fa-right-to-bracket"></i>
    <span id="btnText">Sign In</span>
  </button>

  <div class="secure-tag">
    <i class="fa-solid fa-shield"></i> Secured connection · ASHWIN Panel
  </div>
</form>

<script>
  /* Password toggle */
  const pwToggle = document.getElementById('pwToggle');
  const pwInput  = document.getElementById('password');
  pwToggle.addEventListener('click', () => {
    const show = pwInput.type === 'password';
    pwInput.type = show ? 'text' : 'password';
    pwToggle.innerHTML = show
      ? '<i class="fa-solid fa-eye-slash"></i>'
      : '<i class="fa-solid fa-eye"></i>';
  });

  /* Loading state on submit */
  const form = document.getElementById('loginForm');
  const btn  = document.getElementById('submitBtn');
  const txt  = document.getElementById('btnText');
  form.addEventListener('submit', () => {
    btn.disabled = true;
    txt.textContent = 'Signing in...';
    btn.querySelector('i').className = 'fa-solid fa-spinner fa-spin';
  });
</script>

</body>
</html>
